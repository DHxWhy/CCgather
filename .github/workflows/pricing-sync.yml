name: pricing-sync
# 공식 가격표(platform.claude.com …/pricing.md) → lib/constants/claude-pricing.json 자동 반영.
# 1시간 폴링(안전망) + 서버가 모르는 모델 제출을 보면 repository_dispatch 로 즉시 실행.
# 정각은 GitHub 스케줄 혼잡 시간이라 :17 에 돈다.
# 변경 시 게이트(tsc·테스트) 통과 후 main 직접 푸시 → Vercel 자동 배포.
# GITHUB_TOKEN 푸시는 test.yml 을 트리거하지 않으므로 게이트를 여기서 직접 돌린다.

on:
  schedule:
    - cron: "17 * * * *"
  repository_dispatch:
    types: [pricing-check]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: pricing-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      # 순수 TS 스크립트라 의존성 설치 없이 실행 — 변경 없는 대부분의 실행은 여기서 끝난다.
      - name: Sync official pricing
        id: sync
        env:
          PRICING_REPORT_PATH: ${{ runner.temp }}/pricing-report.md
        run: bun scripts/sync-claude-pricing.ts

      - name: Install dependencies
        if: steps.sync.outputs.status == 'updated'
        run: bun install --frozen-lockfile

      - name: Gate — typecheck + unit tests
        if: steps.sync.outputs.status == 'updated'
        run: |
          bunx tsc --noEmit
          bunx tsc --noEmit -p tsconfig.tests.json
          bun run test

      - name: Commit and push to main
        if: steps.sync.outputs.status == 'updated'
        env:
          SUMMARY: ${{ steps.sync.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/constants/claude-pricing.json
          git commit -m "chore(pricing): 공식 가격표 자동 반영 ($SUMMARY)" \
                     -m "출처: platform.claude.com/docs/en/about-claude/pricing.md" \
                     -m "$(cat "$RUNNER_TEMP/pricing-report.md")"
          git pull --rebase origin main
          git push origin HEAD:main

      # 같은 차단 사유로 매시간 알림이 쌓이지 않도록 열린 이슈 본문과 같으면 건너뛴다.
      - name: Report blocked update (deduplicated issue)
        if: steps.sync.outputs.status == 'blocked'
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="가격표 자동 반영 차단 — 확인 필요"
          body="$(cat "$RUNNER_TEMP/pricing-report.md")"
          num=$(gh issue list --state open --search "in:title $title" --json number -q '.[0].number')
          if [ -n "$num" ]; then
            if [ "$(gh issue view "$num" --json body -q .body)" = "$body" ]; then
              echo "notify=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            gh issue edit "$num" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
          echo "notify=true" >> "$GITHUB_OUTPUT"

      - name: Discord notify
        if: >-
          always() && (
            steps.sync.outputs.status == 'updated' ||
            steps.issue.outputs.notify == 'true' ||
            failure()
          )
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATUS: ${{ job.status == 'failure' && 'failure' || steps.sync.outputs.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$DISCORD_WEBHOOK_URL" ] && { echo "DISCORD_WEBHOOK_URL 미설정 — 알림 생략"; exit 0; }
          case "$STATUS" in
            updated) head="💲 공식 가격표 변경 → main 자동 반영" ;;
            blocked) head="⛔ 가격표 자동 반영 차단 — 이슈 확인 필요" ;;
            *)       head="❌ pricing-sync 실패 (게이트 또는 조회 오류)" ;;
          esac
          report="$(cat "$RUNNER_TEMP/pricing-report.md" 2>/dev/null | head -c 1500)"
          payload=$(jq -n --arg c "$head"$'\n'"$report"$'\n'"$RUN_URL" '{content: $c}')
          curl -sS -o /dev/null -w "Discord HTTP %{http_code}\n" -X POST \
            -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"
